{% extends "base.html" %}

{% block content %}
<h2>Persona Settings</h2>
{% for persona in personas %}
<div class="card mt-3">
    <div class="card-header d-flex justify-content-between">
        {{ persona.name }}
        {% if persona.is_active %}<span class="badge bg-success">Active</span>{% endif %}
    </div>
    <div class="card-body">
        <form action="/api/settings/{{ persona.id }}" method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tone</label>
                    <input type="text" name="tone" class="form-control" value="{{ persona.tone }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Style</label>
                    <input type="text" name="style" class="form-control" value="{{ persona.style }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">System Prompt</label>
                <textarea name="system_prompt" class="form-control" rows="5">{{ persona.system_prompt }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>
</div>
{% endfor %}
{% endblock %}
