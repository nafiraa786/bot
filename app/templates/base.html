<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Assistant Admin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,.1); border-radius: 10px; }
        .btn-primary { border-radius: 8px; }
        .sidebar { background: #343a40; color: white; min-height: 100vh; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover { background: #495057; color: white; }
        .sidebar a.active { color: white; background: #0d6efd; }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar d-none d-md-block" style="width: 250px;">
            <div class="p-4">
                <h4><i class="fas fa-robot me-2"></i> AI Admin</h4>
            </div>
            <nav class="mt-2">
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
                <a href="/approvals" class="{% if request.url.path == '/approvals' %}active{% endif %}"><i class="fas fa-check-circle me-2"></i> Approvals</a>
                <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}"><i class="fas fa-cog me-2"></i> Persona Settings</a>
                <hr class="mx-3 my-2 border-secondary">
                <a href="/login"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1">
            <nav class="navbar navbar-expand-lg navbar-light bg-white d-md-none px-3">
                <a class="navbar-brand" href="#"><i class="fas fa-robot"></i> AI Admin</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="/approvals">Approvals</a></li>
                        <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
                    </ul>
                </div>
            </nav>

            <div class="container-fluid p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function approveItem(id) {
            const response = await fetch(`/api/approve/${id}`, { method: 'POST' });
            if (response.ok) location.reload();
        }
        async function rejectItem(id) {
            const response = await fetch(`/api/reject/${id}`, { method: 'POST' });
            if (response.ok) location.reload();
        }
    </script>
</body>
</html>
