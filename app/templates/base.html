<!DOCTYPE html>
<html>
<head>
    <title>AI Assistant Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">AI Assistant Admin</span>
            <div class="navbar-nav d-flex flex-row">
                <a class="nav-link px-3" href="/">Dashboard</a>
                <a class="nav-link px-3" href="/approvals">Approvals</a>
                <a class="nav-link px-3" href="/settings">Settings</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script>
        async function approveItem(id) {
            const response = await fetch(`/api/approve/${id}`, { method: 'POST' });
            if (response.ok) location.reload();
        }
        async function rejectItem(id) {
            const response = await fetch(`/api/reject/${id}`, { method: 'POST' });
            if (response.ok) location.reload();
        }
    </script>
</body>
</html>
